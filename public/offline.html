<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ghar Tak · offline</title>
<link rel="icon" href="/icons/logo.svg" type="image/svg+xml">
<style>
  :root { color-scheme: dark; }
  body { margin: 0; min-height: 100dvh; display: grid; place-items: center; background: #0e1116; color: #e8eaed;
    font: 16px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; }
  main { max-width: 420px; padding: 24px 20px; }
  img { width: 64px; height: 64px; }
  h1 { font-size: 22px; margin: 12px 0 4px; }
  p { color: #a3acb8; margin: 0 0 16px; }
  a.call { display: flex; gap: 12px; align-items: center; padding: 12px 14px; margin: 8px 0; border-radius: 12px;
    border: 1px solid #2a313c; background: #1a1f27; color: #e8eaed; text-decoration: none; }
  a.call b { font-size: 20px; color: #ff6b5a; min-width: 52px; }
  a.call.primary { background: #dc2626; border-color: #dc2626; color: #fff; }
  a.call.primary b { color: #fff; }
  button { margin-top: 12px; background: none; border: 1px solid #2a313c; color: #f5b942; border-radius: 8px; padding: 8px 14px; font: inherit; }
</style>
</head>
<body>
<main>
  <img src="/icons/logo.svg" alt="">
  <h1>You're offline</h1>
  <p>Routes need an internet connection. These numbers work without one:</p>
  <a class="call primary" href="tel:112"><b>112</b> Emergency: police, fire, ambulance</a>
  <a class="call" href="tel:1091"><b>1091</b> Women helpline, Delhi Police</a>
  <a class="call" href="tel:181"><b>181</b> Women helpline, national</a>
  <a class="call" href="tel:1098"><b>1098</b> Childline</a>
  <a class="call" href="tel:102"><b>102</b> Ambulance (108 in Haryana and UP)</a>
  <a class="call" href="tel:1090"><b>1090</b> UP Women Power Line</a>
  <button onclick="location.reload()">Try again</button>
</main>
</body>
</html>
